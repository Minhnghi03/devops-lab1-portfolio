
name: Lighthouse CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Audit website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://USERNAME.github.io/portfolio/
            https://USERNAME.github.io/portfolio/about.html
            https://USERNAME.github.io/portfolio/contact.html
          uploadArtifacts: true
          runs: 1
